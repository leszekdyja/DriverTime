  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  DriverTimeMobile:
    type: application
    platform: iOS
    sources:
      - DriverTimeMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.drivertime.mobile
